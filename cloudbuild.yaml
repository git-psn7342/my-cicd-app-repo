steps:
  - name: 'node:18'
    id: 'install'
    entrypoint: 'npm'
    args: ['install']

  - name: 'node:18'
    id: 'lint'
    entrypoint: 'npm'
    args: ['run', 'lint']
    waitFor: ['install']

  - name: 'node:18'
    id: 'test'
    entrypoint: 'npm'
    args: ['test']
    waitFor: ['install']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/able-folio-490803-g2/my-app/app:$SHORT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/able-folio-490803-g2/my-app/app:latest'
      - '.'
    waitFor: ['lint', 'test']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/able-folio-490803-g2/my-app/app'
    waitFor: ['build']
  - name: 'gcr.io/cloud-builders/kubectl'
    id: 'deploy-staging'
    args:
      - 'set'
      - 'image'
      - 'deployment/my-cicd-app'
      - 'my-cicd-app=us-central1-docker.pkg.dev/able-folio-490803-g2/my-app/app:$SHORT_SHA'
      - '-n'
      - 'staging'
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=us-central1-a'
      - 'CLOUDSDK_CONTAINER_CLUSTER=my-cicd-cluster'
    waitFor: ['push']


      - 'CLOUDSDK_CONTAINER_CLUSTER=my-cicd-cluster'
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'notify'
    args: ['logging', 'write', 'deployment-audit-log', 'Deployment complete. Image: $SHORT_SHA', '--severity=NOTICE']
    waitFor: ['deploy-staging']



 
options:
  logging: CLOUD_LOGGING_ONLY
